<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>RpX Builder &amp; Search</title>
  <style>
    :root {
      --accent: #ff4c4c;
      --container-bg: rgba(0,0,0,0.6);
      --radius: 10px;
      --shadow: 0 4px 12px rgba(0,0,0,0.4);
      --slot-small: 120px;
      --slot-big: 260px;
      --gap: 20px;
      --builder-scale: 1.1;
    }
    * { box-sizing: border-box; margin:0; padding:0 }
    html, body {
      width:100%; height:100%;
      font-family: Arial, sans-serif;
      background: #000 url('https://raw.githubusercontent.com/Reso1992/RpXBuilder/main/IMG_2579.webp') center/cover no-repeat;
      color: #fff;
      overflow: hidden;
    }
    main {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
    }

    /* Suchleiste */
    .search-bar {
      display: flex; gap:8px; justify-content: center;
      padding: 20px; background: var(--container-bg);
      backdrop-filter: blur(4px);
    }
    .search-bar input {
      width: 60vw; max-width: 300px;
      padding: 8px; border-radius: 4px;
      border: 1px solid #555;
      background: rgba(0,0,0,0.6); color:#fff;
    }
    .search-bar button {
      padding:8px 12px; background:var(--accent);
      border:none; border-radius:4px; color:#fff;
      cursor:pointer;
    }

    /* Such-Ergebnisse */
    #searchResults {
      max-height: 150px; overflow-y: auto;
      margin: 0 20px 20px;
    }
    #searchResults button {
      width: 100%; padding:8px; margin-bottom:6px;
      background: rgba(0,0,0,0.6);
      border:none; border-radius:4px;
      color:#fff; text-align:left;
      cursor:pointer; transition: background .2s;
    }
    #searchResults button:hover {
      background: rgba(0,0,0,0.8);
    }

    /* Builder-Grid */
    .builder-area {
      flex:1;
      display:flex; align-items:center; justify-content:center;
      padding-bottom:20px;
    }
    .build-container {
      display: grid;
      grid-template-areas:
        "l1    l2    l3"
        "sq1   ct   sq2"
        "sq3   ct   sq4"
        "btn   btn  btn";
      grid-template-columns: var(--slot-small) var(--slot-big) var(--slot-small);
      grid-template-rows: auto var(--slot-small) var(--slot-small) auto;
      gap: var(--gap);
      background: var(--container-bg);
      padding: var(--gap); border-radius:8px;
      box-shadow: var(--shadow);
      transform: scale(var(--builder-scale));
      transform-origin: center;
      justify-items: center;
      align-items: center;
    }
    .label {
      text-align: center;
      font-weight: bold;
      text-transform: uppercase;
      color: var(--accent);
    }
    .label[data-area="l1"] { grid-area: l1; }
    .label[data-area="l2"] { grid-area: l2; }
    .label[data-area="l3"] { grid-area: l3; }

    .slot {
      position: relative;
      background: rgba(255,255,255,0.1) center/cover no-repeat;
      border-radius:6px;
      cursor: pointer;
    }
    .slot[data-slot="sq1"] { grid-area: sq1; width:var(--slot-small); height:var(--slot-small); }
    .slot[data-slot="sq2"] { grid-area: sq2; width:var(--slot-small); height:var(--slot-small); }
    .slot[data-slot="sq3"] { grid-area: sq3; width:var(--slot-small); height:var(--slot-small); }
    .slot[data-slot="sq4"] { grid-area: sq4; width:var(--slot-small); height:var(--slot-small); }
    .slot[data-slot="ct"] {
      grid-area: ct;
      width: var(--slot-big); height: var(--slot-big);
      border-radius:50%;
    }
    .slot::before {
      content: "+"; position: absolute;
      top:50%; left:50%;
      transform: translate(-50%,-50%);
      font-size:36px; color:#ccc;
      pointer-events: none;
    }
    .slot.filled::before { display: none; }

    .buttons {
      grid-area: btn;
      display:flex; gap:8px; justify-content:center;
      width: 100%;
    }
    .buttons button {
      flex:1; padding:12px 0;
      background: var(--accent); border:none;
      border-radius:4px; color:#fff; cursor:pointer;
      font-weight:bold; transition: background .2s;
    }
    .buttons button:hover {
      background: #e04343;
    }

    /* Icon-Picker Overlay */
    #iconPicker {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      z-index:20;
      align-items: center;
      justify-content: center;
    }
    #iconPicker .panel {
      background: var(--container-bg);
      padding: 16px; border-radius: 8px;
      display: grid; grid-template-columns: repeat(4,64px);
      gap: 8px;
    }
    #iconPicker img {
      width:64px; height:64px; object-fit:cover;
      cursor:pointer; border:2px solid transparent;
      border-radius:4px; transition:border-color .2s;
    }
    #iconPicker img:hover {
      border-color: var(--accent);
    }
  </style>
</head>
<body>
  <main>
    <div class="search-bar">
      <input id="searchInput" placeholder="Heldenname…">
      <button onclick="searchBuild()">Suchen</button>
    </div>
    <div id="searchResults"></div>
    <div class="builder-area">
      <div class="build-container">
        <div class="label" data-area="l1">Starnarks</div>
        <div class="label" data-area="l2">Artifacts</div>
        <div class="label" data-area="l3">Starnarks</div>

        <div class="slot" data-slot="sq1" data-category="Starnarks"></div>
        <div class="slot" data-slot="ct"  data-category="Artifacts"></div>
        <div class="slot" data-slot="sq2" data-category="Starnarks"></div>
        <div class="slot" data-slot="sq3" data-category="Starnarks"></div>
        <div class="slot" data-slot="sq4" data-category="Starnarks"></div>

        <div class="buttons">
          <button onclick="saveBuild()">Speichern</button>
          <button onclick="generateLink()">Link kopieren</button>
        </div>
      </div>
    </div>
  </main>

  <!-- Icon Picker -->
  <div id="iconPicker" onclick="closePicker()">
    <div class="panel" onclick="e=>e.stopPropagation()"></div>
  </div>

  <script>
    // GitHub-Konfig – ersetze durch Dein Repo
    const REPO   = 'Reso1992/RpXBuilder';
    const BRANCH = 'main';

    let pickerSlot = null;

    // Slots anklickbar machen
    document.querySelectorAll('.slot').forEach(slot => {
      slot.addEventListener('click', async () => {
        pickerSlot = slot;
        const category = slot.dataset.category;
        const panel = document.querySelector('#iconPicker .panel');
        panel.innerHTML = '';

        try {
          const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${category}?ref=${BRANCH}`);
          const files = await res.json();
          files.forEach(file => {
            if (file.type === 'file') {
              const img = document.createElement('img');
              img.src = file.download_url;
              img.title = file.name;
              img.onclick = () => {
                // Icon wählen
                slot.style.backgroundImage = `url(${img.src})`;
                slot.classList.add('filled');
                closePicker();
              };
              panel.appendChild(img);
            }
          });
        } catch(e) {
          panel.innerHTML = '<p style="color:#f55;">Fehler beim Laden</p>';
          console.error(e);
        }

        document.getElementById('iconPicker').style.display = 'flex';
      });
    });

    function closePicker() {
      document.getElementById('iconPicker').style.display = 'none';
    }

    // Suche
    function searchBuild(){
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      const res = document.getElementById('searchResults');
      res.innerHTML = '';
      if (!q) return;
      const builds = JSON.parse(localStorage.getItem('rpxBuilds')||'{}');
      let found = false;
      for(const hero in builds){
        if(hero.toLowerCase().includes(q)){
          for(const type in builds[hero]){
            const btn = document.createElement('button');
            btn.textContent = `${hero} (${type.toUpperCase()})`;
            btn.onclick = () => loadBuild(hero,type);
            res.appendChild(btn);
            found = true;
          }
        }
      }
      if(!found) res.innerHTML = '<p>Keine Builds gefunden.</p>';
    }

    // Load Build
    function loadBuild(hero,type){
      const data = JSON.parse(localStorage.getItem('rpxBuilds')||'{}')[hero][type];
      document.querySelectorAll('.slot').forEach(s => {
        const cat = s.dataset.category;
        const url = (data.slots||{})[cat]||'';
        s.style.backgroundImage = url ? `url(${url})` : '';
        s.classList.toggle('filled', !!url);
      });
    }

    function saveBuild(){ alert('Build gespeichert!'); }
    function generateLink(){ alert('Link kopiert!'); }
  </script>
</body>
</html>

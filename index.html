<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>RpX Builder &amp; Search</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --accent: #ff4c4c;
      --radius: 10px;
      --shadow: 0 12px 40px rgba(0,0,0,0.6);
      --bg-layer: rgba(0,0,0,0.5);
      --transition: .25s ease;
      --slot-small: 110px;
      --slot-big: 220px;
      --gap: 18px;
      --label-color: #ff3f3f;
      --builder-scale: 1;
      --label-offset-x: 0;
      --label-offset-y: 0;
    }
    * { box-sizing:border-box; }
    body {
      margin:0;
      font-family: system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;
      background: #000;
      min-height:100vh;
      color:#fff;
      overflow-x:hidden;
    }
    main {
      position:relative;
      z-index:1;
      padding: 14px 16px 40px;
      display:flex;
      flex-direction:column;
      gap:12px;
      width:100%;
      max-width:1600px;
      margin:0 auto;
    }

    /* Suchleiste */
    .search-bar {
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      width:100%;
      margin:0 auto;
      background: rgba(255,255,255,0.03);
      padding:12px 14px;
      border-radius:8px;
      backdrop-filter: blur(6px);
      position:relative;
    }
    .search-bar input {
      flex:1 1 300px;
      padding:14px 16px;
      border-radius:6px;
      border:1px solid rgba(255,255,255,0.1);
      background: rgba(0,0,0,0.4);
      color:#fff;
      font-size:1rem;
      outline:none;
      transition:box-shadow var(--transition);
      min-width:160px;
    }
    .search-bar input:focus { box-shadow: 0 0 12px rgba(255,76,76,.7); }
    .search-bar button {
      flex:0 0 160px;
      padding:14px;
      background: var(--accent);
      border:none;
      border-radius:6px;
      color:#fff;
      cursor:pointer;
      font-weight:600;
      position:relative;
      overflow:hidden;
      transition:transform .15s, filter .2s;
    }
    .search-bar button:active { transform: scale(.95); }
    .search-bar button:hover { filter: brightness(1.05); }

    /* Suchergebnisse / Builds */
    #searchResults {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 6px;
      max-height: 320px;
      overflow-y: auto;
      width: 100%;
      margin: 0 auto;
    }
    .build-card {
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      padding: 8px;
      width: 150px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      position: relative;
      font-size: 11px;
      gap: 6px;
      transition: transform .15s, filter .2s;
    }
    .build-card:hover { transform: translateY(-2px); filter: brightness(1.05); }
    .build-card .title {
      font-weight: 600;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
    }
    .build-card .avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      overflow: hidden;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid rgba(255,255,255,0.2);
    }
    .build-card .avatar img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .slots-preview {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
    }
    .slot-thumb {
      width: 16px;
      height: 16px;
      border-radius: 3px;
      background-size: cover;
      background-position: center;
    }
    .no-builds {
      width: 100%;
      padding: 8px;
      text-align: center;
    }

    /* Builder */
    .builder-area {
      flex:1;
      display:flex;
      justify-content:center;
      align-items:flex-start;
      padding:0;
      margin-top:10px;
      position:relative;
    }
    .build-container {
      position:relative;
      display:grid;
      gap: var(--gap);
      background: rgba(255,255,255,0.03);
      padding:28px 30px 40px;
      border-radius:14px;
      box-shadow: var(--shadow);
      width:100%;
      max-width:1200px;
      grid-template-columns: minmax(140px, 1fr) 220px 260px 160px;
      grid-template-rows:
        auto
        auto
        auto
        auto;
      grid-template-areas:
        "hero hero hero hero"
        "label-starmarks label-artifacts label-artifacts label-moon"
        "starmarks artifacts artifacts moonbadges"
        "starmarks artifacts artifacts moonbadges"
        "actions actions actions actions";
      align-items:start;
      overflow: hidden;
      transform: scale(var(--builder-scale));
    }

    .builder-character {
      position: absolute;
      top: 50%;
      left: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      width: 90%;
      height: 90%;
      background-position: center;
      background-size: contain;
      background-repeat: no-repeat;
      opacity: 0.18;
      z-index: 0;
      transition: opacity .3s;
    }

    .hero-slot {
      grid-area: hero;
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      gap:12px;
      padding:12px 16px;
      background: rgba(255,255,255,0.04);
      border-radius:10px;
      position:relative;
      width:100%;
      max-width:250px;
      z-index:1;
    }
    .hero-preview {
      position:relative;
      width:100px;
      height:100px;
      border-radius:50%;
      overflow:hidden;
      background: #111;
      flex:0 0 auto;
      border:3px solid gold;
      display:flex;
      justify-content:center;
      align-items:center;
    }
    .hero-preview img {
      width:100%;
      height:100%;
      object-fit:contain;
      filter: none;
    }
    .hero-info {
      flex:1;
      display:flex;
      flex-direction:column;
      gap:4px;
    }
    .hero-label {
      font-size:.65rem;
      text-transform:uppercase;
      letter-spacing:1px;
      margin:0;
      font-weight:600;
      color:#fff;
    }
    .hero-selection {
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      align-items:center;
    }
    .hero-select {
      padding:8px 16px;
      background: var(--accent);
      border:none;
      border-radius:6px;
      color:#fff;
      cursor:pointer;
      font-weight:600;
      text-transform:uppercase;
      transition:transform .15s, filter .2s;
    }
    .hero-select:active { transform: scale(.95); }
    .hero-select:hover { filter: brightness(1.05); }

    .hero-background {
      position:absolute;
      inset:0;
      z-index:-1;
      background-size:contain;
      background-position:center;
      background-repeat:no-repeat;
      opacity:.08;
    }

    .group-label {
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:1px;
      font-size:1rem;
      color: var(--label-color);
      display:inline-block;
      margin-bottom:6px;
      transform: translate(var(--label-offset-x), var(--label-offset-y));
    }
    .label-starmarks { grid-area: label-starmarks; justify-self:center; }
    .label-artifacts { grid-area: label-artifacts; justify-self:center; }
    .label-moon { grid-area: label-moon; justify-self:center; }

    .starmarks {
      grid-area: starmarks;
      display:grid;
      grid-template-columns: repeat(2, var(--slot-small));
      grid-template-rows: repeat(2, var(--slot-small));
      gap:14px;
      position:relative;
      justify-content:center;
    }
    .artifacts {
      grid-area: artifacts;
      display:flex;
      justify-content:center;
      align-items:center;
      position:relative;
      min-width: var(--slot-big);
      min-height: var(--slot-big);
    }
    .moonbadges {
      grid-area: moonbadges;
      display:flex;
      flex-direction:column;
      gap:18px;
      justify-content:flex-start;
      align-items:center;
    }
    .moon-circle {
      position:relative;
      width: var(--slot-small);
      height: var(--slot-small);
      border-radius:50%;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .slot {
      position:relative;
      background: rgba(255,255,255,0.02) center/cover no-repeat;
      cursor:pointer;
      border-radius:8px;
      transition: box-shadow var(--transition), transform .15s;
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
      width: var(--slot-small);
      height: var(--slot-small);
    }
    .slot .plus {
      position:absolute;
      display:flex;
      justify-content:center;
      align-items:center;
      inset:0;
      font-size:32px;
      color: rgba(255,255,255,0.75);
      pointer-events:none;
    }
    .slot.filled .plus { display:none; }
    .slot:hover { filter: brightness(1.08); }
    .slot:active { transform: scale(.95); }

    .slot[data-category="Starmarks"] {
      box-shadow: 0 0 14px gold, 0 0 28px gold;
      border:3px solid gold;
    }
    .slot[data-category="Artifacts"] {
      box-shadow: 0 0 14px red, 0 0 28px red;
      border:3px solid red;
      border-radius:50%;
      width: var(--slot-big);
      height: var(--slot-big);
    }
    .slot[data-category="MoonBadges"] {
      box-shadow: 0 0 14px #ccc, 0 0 28px #ccc;
      border:3px solid rgba(255,255,255,.6);
      border-radius:50%;
      width: var(--slot-small);
      height: var(--slot-small);
    }

    .actions {
      grid-area: actions;
      display:flex;
      gap:16px;
      margin-top:20px;
      flex-wrap:wrap;
    }
    .actions button {
      flex:1;
      min-width:200px;
      padding:16px 12px;
      background: var(--accent);
      border:none;
      border-radius:8px;
      color:#fff;
      font-weight:600;
      cursor:pointer;
      transition:transform .15s, filter .2s;
    }
    .actions button:active { transform: scale(.95); }
    .actions button:hover { filter: brightness(1.05); }

    /* Picker Overlay (Icons / Characters) */
    #iconPicker, #charPicker {
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.85);
      z-index:90;
      align-items:flex-start;
      justify-content:center;
      padding:80px 14px 14px;
      overflow:auto;
    }
    .picker-panel {
      background: rgba(255,255,255,0.04);
      padding:18px;
      border-radius:10px;
      max-width:1000px;
      width:100%;
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(80px,1fr));
      gap:12px;
      position:relative;
    }
    .picker-header {
      grid-column:1/-1;
      margin-bottom:8px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
    }
    .picker-header h2 {
      margin:0;
      font-size:1.2rem;
      font-weight:600;
    }
    .close-btn {
      background: transparent;
      border:none;
      color:#fff;
      cursor:pointer;
      font-size:1.2rem;
      padding:6px 10px;
      border-radius:6px;
      transition:background .2s;
    }
    .close-btn:hover { background: rgba(255,255,255,0.08); }

    /* Grid für Picker-Inhalte: ca. 10 nebeneinander in normaler Größe */
    #charItems, #iconItems {
      display: grid;
      grid-template-columns: repeat(10, 100px);
      gap:8px;
      padding:6px 0;
      max-height:60vh;
      overflow:auto;
      justify-content: start;
    }
    .picker-item {
      background: rgba(255,255,255,0.03);
      border-radius:6px;
      position:relative;
      cursor:pointer;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:6px;
      transition: transform .15s, box-shadow .2s;
      aspect-ratio:1/1;
      min-width:0;
    }
    .picker-item:hover { transform: scale(1.05); }
    .picker-item:active { transform: scale(.95); }
    .picker-item img {
      max-width:100%;
      max-height:100%;
      object-fit:contain;
      border-radius:4px;
    }

    @media (max-width: 1200px) {
      .build-container {
        grid-template-columns: 1fr 1fr 1fr;
        grid-template-areas:
          "hero hero hero"
          "label-starmarks label-artifacts label-moon"
          "starmarks artifacts moonbadges"
          "starmarks artifacts moonbadges"
          "actions actions actions";
      }
      .moonbadges { align-items:flex-start; }
    }
    @media (max-width: 900px) {
      .build-container {
        grid-template-columns: 1fr;
        grid-template-areas:
          "hero"
          "label-starmarks"
          "starmarks"
          "label-artifacts"
          "artifacts"
          "label-moon"
          "moonbadges"
          "actions";
      }
      .starmarks { justify-content:center; }
      .artifacts { justify-content:center; }
      .moonbadges { flex-direction:row; gap:12px; }
    }
  </style>
</head>
<body>
  <main>
    <!-- Suchleiste -->
    <div class="search-bar">
      <input id="searchInput" placeholder="Build-Namen…" />
      <button onclick="searchBuild()">Suchen</button>
    </div>
    <div id="searchResults"></div>

    <!-- Builder -->
    <div class="builder-area">
      <div class="build-container">
        <div class="builder-character" id="builderCharacterBg"></div>

        <!-- Charakter -->
        <div class="hero-slot">
          <div class="hero-preview" id="heroDisplay">
            <div style="font-size:12px;opacity:.7;" id="noCharText">Keine</div>
          </div>
          <div class="hero-info">
            <div class="hero-label">Charakter</div>
            <div class="hero-selection">
              <button class="hero-select" onclick="openCharacterPicker()">Charakter wählen</button>
            </div>
          </div>
        </div>

        <!-- Labels -->
        <div class="group-label label-starmarks">Starmarks</div>
        <div class="group-label label-artifacts">Artifacts</div>
        <div class="group-label label-moon">Moonbadges</div>

        <!-- Starmarks 2x2 -->
        <div class="starmarks">
          <div class="slot" data-slot="sq1" data-category="Starmarks"><div class="plus">+</div></div>
          <div class="slot" data-slot="sq3" data-category="Starmarks"><div class="plus">+</div></div>
          <div class="slot" data-slot="sq5" data-category="Starmarks"><div class="plus">+</div></div>
          <div class="slot" data-slot="sq6" data-category="Starmarks"><div class="plus">+</div></div>
        </div>

        <!-- Artifacts -->
        <div class="artifacts">
          <div class="slot" data-slot="ct" data-category="Artifacts"><div class="plus">+</div></div>
        </div>

        <!-- Moonbadges -->
        <div class="moonbadges">
          <div class="moon-circle">
            <div class="slot" data-slot="sq2" data-category="MoonBadges"><div class="plus">+</div></div>
          </div>
          <div class="moon-circle">
            <div class="slot" data-slot="sq4" data-category="MoonBadges"><div class="plus">+</div></div>
          </div>
        </div>

        <!-- Aktionen -->
        <div class="actions">
          <button onclick="saveBuild()">Speichern</button>
          <button onclick="generateLink()">Link kopieren</button>
        </div>
      </div>
    </div>
  </main>

  <!-- Character Picker Overlay -->
  <div id="charPicker">
    <div class="picker-panel">
      <div class="picker-header">
        <h2>Charakter wählen</h2>
        <button class="close-btn" onclick="closeCharacterPicker()">✕</button>
      </div>
      <div id="charItems"></div>
    </div>
  </div>

  <!-- Icon Picker Overlay -->
  <div id="iconPicker">
    <div class="picker-panel">
      <div class="picker-header">
        <h2>Icon wählen</h2>
        <button class="close-btn" onclick="closePicker()">✕</button>
      </div>
      <div id="iconItems"></div>
    </div>
  </div>

  <!-- Dev Panel (unverändert, wie vorher) -->
  <button id="devToggle" style="position:fixed; top:12px; right:12px; background:#111; border:2px solid #ff4c4c; padding:8px 14px; color:#fff; border-radius:6px; cursor:pointer; z-index:999; font-size:0.85rem; backdrop-filter:blur(4px);">Dev</button>
  <div id="devPanel" aria-label="Dev Panel" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background: rgba(0,0,0,0.95); padding:16px 18px; border-radius:10px; width:340px; max-width:90vw; box-shadow:0 0 24px rgba(255,76,76,.7); z-index:1000; font-family: system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif; color:#fff; font-size:13px; gap:8px;">
    <button id="devClose" style="position:absolute; top:6px; right:6px; background:transparent; border:none; color:#fff; font-size:16px; cursor:pointer;">✕</button>
    <h4 style="margin:0 0 6px; font-size:1rem; letter-spacing:1px;">Developer Panel</h4>
    <div class="dev-row" style="display:flex; gap:6px; align-items:center; margin-bottom:6px;">
      <label for="inpSlotSmall" style="flex:1; min-width:80px;">Starmark / MoonBadge</label>
      <input id="inpSlotSmall" type="number" min="50" step="5" style="flex:1; padding:4px 6px; background:#1a1a1a; border:1px solid #444; border-radius:4px; color:#fff; font-size:12px; width:100%;" />
    </div>
    <div class="dev-row" style="display:flex; gap:6px; align-items:center; margin-bottom:6px;">
      <label for="inpSlotBig" style="flex:1; min-width:80px;">Artifact</label>
      <input id="inpSlotBig" type="number" min="100" step="5" style="flex:1; padding:4px 6px; background:#1a1a1a; border:1px solid #444; border-radius:4px; color:#fff; font-size:12px; width:100%;" />
    </div>
    <div class="dev-row" style="display:flex; gap:6px; align-items:center; margin-bottom:6px;">
      <label for="inpGap" style="flex:1; min-width:80px;">Gap</label>
      <input id="inpGap" type="number" min="0" step="2" style="flex:1; padding:4px 6px; background:#1a1a1a; border:1px solid #444; border-radius:4px; color:#fff; font-size:12px; width:100%;" />
    </div>
    <div class="dev-row" style="display:flex; gap:6px; align-items:center; margin-bottom:6px;">
      <label for="inpBuilderScale" style="flex:1; min-width:80px;">Builder Scale</label>
      <input id="inpBuilderScale" type="number" step="0.01" min="0.6" max="1.5" style="flex:1; padding:4px 6px; background:#1a1a1a; border:1px solid #444; border-radius:4px; color:#fff; font-size:12px; width:100%;" />
    </div>
    <div class="dev-row" style="display:flex; gap:6px; align-items:center; margin-bottom:6px;">
      <label for="inpLabelOffsetX" style="flex:1; min-width:80px;">Label Offset X</label>
      <input id="inpLabelOffsetX" type="number" step="1" style="flex:1; padding:4px 6px; background:#1a1a1a; border:1px solid #444; border-radius:4px; color:#fff; font-size:12px; width:100%;" />
    </div>
    <div class="dev-row" style="display:flex; gap:6px; align-items:center; margin-bottom:6px;">
      <label for="inpLabelOffsetY" style="flex:1; min-width:80px;">Label Offset Y</label>
      <input id="inpLabelOffsetY" type="number" step="1" style="flex:1; padding:4px 6px; background:#1a1a1a; border:1px solid #444; border-radius:4px; color:#fff; font-size:12px; width:100%;" />
    </div>
    <div id="devActions" style="display:flex; gap:6px; margin-top:4px;">
      <button id="applyDev" style="flex:1; padding:8px; background:#ff4c4c; border:none; border-radius:6px; cursor:pointer; color:#fff; font-weight:600; font-size:12px;">Anwenden</button>
      <button id="resetDev" style="flex:1; padding:8px; background:#ff4c4c; border:none; border-radius:6px; cursor:pointer; color:#fff; font-weight:600; font-size:12px;">Reset</button>
      <button id="copyCSS" style="flex:1; padding:8px; background:#ff4c4c; border:none; border-radius:6px; cursor:pointer; color:#fff; font-weight:600; font-size:12px;">Export CSS</button>
    </div>
    <div style="margin-top:6px;">
      <div style="margin-bottom:4px;">Aktueller CSS-Block:</div>
      <textarea id="exportCSS" readonly style="width:100%; height:80px; background:#121212; border:1px solid #333; color:#fff; padding:6px; border-radius:5px; font-family: monospace; font-size:11px; resize: vertical;"></textarea>
    </div>
    <div style="font-size:11px; margin-top:6px;">
      Änderungen bleiben lokal. Wenn du sie dauerhaft willst: kopiere den Block oben in dein <code>:root</code>.
    </div>
  </div>

  <script>
    const REPO   = 'Reso1992/RpXBuilder';
    const BRANCH = 'main';
    let activeSlot = null;
    let selectedCharacter = null;

    const categoryFolderMap = {
      Starmarks:  'Starmarks',
      Artifacts:  'Artifacts',
      MoonBadges: 'Moonbadges',
      Characters: 'Characters'
    };

    // Slot klicken für Icon
    document.querySelectorAll('.slot').forEach(slot => {
      slot.addEventListener('click', async () => {
        activeSlot = slot;
        const cat = slot.dataset.category;
        const folder = categoryFolderMap[cat];
        const container = document.getElementById('iconItems');
        if (container) container.innerHTML = '';
        try {
          const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${folder}?ref=${BRANCH}`);
          if (!res.ok) throw new Error('Ordner nicht gefunden');
          const files = await res.json();
          if (!files.length) {
            if (container) container.innerHTML = '<div style="color:#f55;">Keine Icons.</div>';
          } else {
            files.forEach(f => {
              if (f.type === 'file') {
                const item = document.createElement('div');
                item.classList.add('picker-item');
                const img = document.createElement('img');
                img.src = f.download_url;
                img.title = f.name;
                item.appendChild(img);
                item.onclick = () => {
                  slot.style.backgroundImage = `url(${f.download_url})`;
                  slot.classList.add('filled');
                  slot.dataset.url = f.download_url;
                  closePicker();
                };
                container.appendChild(item);
              }
            });
          }
        } catch (e) {
          if (container) container.innerHTML = `<div style="color:#f55;">Fehler beim Laden</div>`;
          console.error(e);
        }
        document.getElementById('iconPicker').style.display = 'flex';
      });
    });
    function closePicker() {
      document.getElementById('iconPicker').style.display = 'none';
    }

    // Charakter Picker öffnen
    async function openCharacterPicker() {
      const container = document.getElementById('charItems');
      container.innerHTML = '';
      try {
        const res = await fetch(`https://api.github.com/repos/${REPO}/contents/Characters?ref=${BRANCH}`);
        if (!res.ok) throw new Error('Characters nicht erreichbar');
        const files = await res.json();
        if (!files.length) {
          container.innerHTML = '<div style="color:#f55;">Keine Charaktere.</div>';
        } else {
          files.forEach(f => {
            if (f.type === 'file') {
              const item = document.createElement('div');
              item.classList.add('picker-item');
              const img = document.createElement('img');
              img.src = f.download_url;
              img.title = f.name;
              item.appendChild(img);
              item.onclick = () => {
                selectedCharacter = f;
                updateHero(f);
                closeCharacterPicker();
              };
              container.appendChild(item);
            }
          });
        }
      } catch (e) {
        container.innerHTML = `<div style="color:#f55;">Fehler beim Laden</div>`;
        console.error(e);
      }
      document.getElementById('charPicker').style.display = 'flex';
    }
    function closeCharacterPicker() {
      document.getElementById('charPicker').style.display = 'none';
    }

    // Hero aktualisieren (ohne Name daneben)
    function updateHero(f) {
      const disp = document.getElementById('heroDisplay');
      const noText = document.getElementById('noCharText');
      if (noText) noText.style.display = 'none';
      disp.innerHTML = '';
      const img = document.createElement('img');
      img.src = f.download_url;
      img.alt = f.name;
      disp.appendChild(img);

      // Hintergrund im hero-slot
      const heroSlot = disp.closest('.hero-slot');
      if (heroSlot) {
        let bg = heroSlot.querySelector('.hero-background');
        if (!bg) {
          bg = document.createElement('div');
          bg.className = 'hero-background';
          heroSlot.appendChild(bg);
        }
        bg.style.backgroundImage = `url(${f.download_url})`;
      }

      // großes Hintergrundbild im Builder
      const container = document.querySelector('.build-container');
      let big = container.querySelector('.builder-character');
      if (!big) {
        big = document.createElement('div');
        big.className = 'builder-character';
        container.prepend(big);
      }
      big.style.backgroundImage = `url(${f.download_url})`;
      big.style.opacity = '0.18';
    }

    // Build speichern (GitHub + Fallback localStorage)
    async function saveBuild() {
      const name = prompt('Name für Deinen Build:');
      if (!name) return;
      const slots = {};
      document.querySelectorAll('.slot').forEach(s => {
        slots[s.dataset.slot] = s.dataset.url || '';
      });
      const character = selectedCharacter ? selectedCharacter.download_url : '';
      const payload = { name, slots, character };
      // Versuche GitHub / Netlify
      try {
        const res = await fetch('/.netlify/functions/saveBuilds', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, slots, character })
        });
        if (!res.ok) throw new Error('Remote save failed');
        alert(`Build "${name}" gespeichert (remote).`);
      } catch (err) {
        console.warn('Remote save fehlgeschlagen, speichere lokal.', err);
        // lokal speichern
        const stored = JSON.parse(localStorage.getItem('rpx_builds') || '{}');
        stored[name] = { slots, character };
        localStorage.setItem('rpx_builds', JSON.stringify(stored));
        alert(`Build "${name}" lokal gespeichert (Fallback).`);
      }
    }

    // Build laden (priorisiert remote, sonst lokal)
    async function loadBuild(name) {
      let data = null;
      try {
        const r = await fetch(`https://raw.githubusercontent.com/${REPO}/${BRANCH}/builds.json`);
        if (r.ok) {
          const builds = await r.json();
          if (builds[name]) data = builds[name];
        }
      } catch {}
      if (!data) {
        const stored = JSON.parse(localStorage.getItem('rpx_builds') || '{}');
        if (stored[name]) data = stored[name];
      }
      if (!data) return alert(`Build "${name}" nicht gefunden.`);
      document.querySelectorAll('.slot').forEach(s => {
        const url = data.slots?.[s.dataset.slot] || '';
        if (url) {
          s.style.backgroundImage = `url(${url})`;
          s.classList.add('filled');
          s.dataset.url = url;
        } else {
          s.style.backgroundImage = '';
          s.classList.remove('filled');
          delete s.dataset.url;
        }
      });
      if (data.character) {
        selectedCharacter = { download_url: data.character, name: '' };
        updateHero({ download_url: data.character, name: 'BuildChar' });
      }
    }

    // Suche
    async function searchBuild() {
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      const res = document.getElementById('searchResults');
      res.innerHTML = '';
      if (!q) return;
      // kombiniere remote + lokal
      let builds = {};
      try {
        const r = await fetch(`https://raw.githubusercontent.com/${REPO}/${BRANCH}/builds.json`);
        if (r.ok) {
          builds = await r.json();
        }
      } catch {}
      // local ergänzt oder überschreibt nicht(remote)
      try {
        const local = JSON.parse(localStorage.getItem('rpx_builds') || '{}');
        builds = { ...local, ...builds };
      } catch {}

      let found = false;
      Object.entries(builds).forEach(([name, data]) => {
        if (!name.toLowerCase().includes(q)) return;
        found = true;

        const card = document.createElement('div');
        card.classList.add('build-card');
        card.onclick = () => loadBuild(name);

        // Avatar: Charakter oder erstes Slot-Icon
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        const imgEl = document.createElement('img');
        if (data.character) {
          imgEl.src = data.character;
        } else {
          const slotUrl = Object.values(data.slots || {}).find(u => u);
          imgEl.src = slotUrl || '';
        }
        avatar.appendChild(imgEl);
        card.appendChild(avatar);

        // Titel
        const title = document.createElement('div');
        title.className = 'title';
        title.textContent = name;
        card.appendChild(title);

        // kleine Vorschau der Slots
        const preview = document.createElement('div');
        preview.className = 'slots-preview';
        Object.entries(data.slots || {}).forEach(([slotKey, url]) => {
          if (!url) return;
          const thumb = document.createElement('div');
          thumb.className = 'slot-thumb';
          thumb.style.backgroundImage = `url(${url})`;
          preview.appendChild(thumb);
        });
        card.appendChild(preview);

        res.appendChild(card);
      });
      if (!found) {
        const none = document.createElement('div');
        none.className = 'no-builds';
        none.textContent = 'Keine Builds gefunden.';
        res.appendChild(none);
      }
    }

    // Link generieren
    function generateLink() {
      const params = new URLSearchParams();
      document.querySelectorAll('.slot').forEach(s => {
        if (s.dataset.url) params.set(s.dataset.slot, s.dataset.url);
      });
      if (selectedCharacter) params.set('character', selectedCharacter.download_url);
      navigator.clipboard.writeText(`${location.origin+location.pathname}?${params}`)
        .then(() => alert('Link kopiert!'));
    }

    // URL beim Laden
    window.addEventListener('load', () => {
      const p = new URLSearchParams(location.search);
      document.querySelectorAll('.slot').forEach(s => {
        const url = p.get(s.dataset.slot);
        if (url) {
          s.style.backgroundImage = `url(${url})`;
          s.classList.add('filled');
          s.dataset.url = url;
        }
      });
      if (p.get('character')) {
        selectedCharacter = { download_url: p.get('character'), name: '' };
        updateHero({ download_url: p.get('character'), name: 'URLChar' });
      }

      // Dev panel init
      initDevPanel();
    });

    // Dev Panel Logic
    function initDevPanel(){
      const PASSWORD = 'devpass';
      const devToggle = document.getElementById('devToggle');
      const panel = document.getElementById('devPanel');
      const closeBtn = document.getElementById('devClose');
      const inpSlotSmall = document.getElementById('inpSlotSmall');
      const inpSlotBig = document.getElementById('inpSlotBig');
      const inpGap = document.getElementById('inpGap');
      const inpBuilderScale = document.getElementById('inpBuilderScale');
      const inpLabelOffsetX = document.getElementById('inpLabelOffsetX');
      const inpLabelOffsetY = document.getElementById('inpLabelOffsetY');
      const exportCSS = document.getElementById('exportCSS');

      const defaults = {
        '--slot-small': 110,
        '--slot-big': 220,
        '--gap': 18,
        'builder-scale': 1,
        labelOffsetX: 0,
        labelOffsetY: 0
      };
      let state = JSON.parse(localStorage.getItem('rpxDevConfig')||'{}');
      state = Object.assign({}, defaults, state);

      function syncInputs(){
        inpSlotSmall.value = state['--slot-small'];
        inpSlotBig.value = state['--slot-big'];
        inpGap.value = state['--gap'];
        inpBuilderScale.value = state['builder-scale'];
        inpLabelOffsetX.value = state.labelOffsetX;
        inpLabelOffsetY.value = state.labelOffsetY;
      }
      function applyState(){
        document.documentElement.style.setProperty('--slot-small', state['--slot-small'] + 'px');
        document.documentElement.style.setProperty('--slot-big', state['--slot-big'] + 'px');
        document.documentElement.style.setProperty('--gap', state['--gap'] + 'px');
        document.documentElement.style.setProperty('--builder-scale', state['builder-scale']);
        document.documentElement.style.setProperty('--label-offset-x', state.labelOffsetX + 'px');
        document.documentElement.style.setProperty('--label-offset-y', state.labelOffsetY + 'px');
        const container = document.querySelector('.build-container');
        if(container) container.style.transform = `scale(${state['builder-scale']})`;
        updateExport();
      }
      function updateExport(){
        exportCSS.value = `
:root {
  --slot-small: ${state['--slot-small']}px;
  --slot-big: ${state['--slot-big']}px;
  --gap: ${state['--gap']}px;
  --builder-scale: ${state['builder-scale']};
  --label-offset-x: ${state.labelOffsetX}px;
  --label-offset-y: ${state.labelOffsetY}px;
}
`.trim();
      }
      function persist(){ localStorage.setItem('rpxDevConfig', JSON.stringify(state)); }

      syncInputs();
      applyState();

      devToggle.addEventListener('click', ()=>{
        const attempt = prompt('Dev Panel Passwort:');
        if(attempt !== PASSWORD){ alert('Falsches Passwort'); return; }
        panel.style.display='flex';
      });
      closeBtn.addEventListener('click', ()=> panel.style.display='none');

      document.getElementById('applyDev').addEventListener('click', ()=>{
        state['--slot-small'] = parseInt(inpSlotSmall.value) || defaults['--slot-small'];
        state['--slot-big'] = parseInt(inpSlotBig.value) || defaults['--slot-big'];
        state['--gap'] = parseInt(inpGap.value) || defaults['--gap'];
        state['builder-scale'] = parseFloat(inpBuilderScale.value) || defaults['builder-scale'];
        state.labelOffsetX = parseInt(inpLabelOffsetX.value) || 0;
        state.labelOffsetY = parseInt(inpLabelOffsetY.value) || 0;
        persist();
        applyState();
      });
      document.getElementById('resetDev').addEventListener('click', ()=>{
        state = Object.assign({}, defaults);
        syncInputs();
        persist();
        applyState();
      });
      document.getElementById('copyCSS').addEventListener('click', ()=>{
        exportCSS.select();
        document.execCommand('copy');
        alert('CSS kopiert. Wenn du willst, kannst du es später manuell ins :root schreiben.');
      });
    }
  </script>
</body>

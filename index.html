<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>RpX Builder &amp; Search</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --accent: #ff4c4c;
      --radius: 10px;
      --shadow: 0 12px 40px rgba(0,0,0,0.6);
      --transition: .25s ease;
      --slot-small: 110px;
      --slot-big: 220px;
      --gap: 18px;
      --label-color: #ff3f3f;
      --builder-scale: 1;
      --label-offset-x: 0;
      --label-offset-y: 0;
      --picker-bg: rgba(255,255,255,0.04);
    }
    * { box-sizing:border-box; }
    body {
      margin:0;
      font-family: system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;
      background: #000;
      min-height:100vh;
      color:#fff;
      overflow-x:hidden;
    }
    main {
      position:relative;
      z-index:1;
      padding: 14px 16px 40px;
      display:flex;
      flex-direction:column;
      gap:12px;
      width:100%;
      max-width:1600px;
      margin:0 auto;
    }
    .search-bar {
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      width:100%;
      margin:0 auto;
      background: rgba(255,255,255,0.03);
      padding:12px 14px;
      border-radius:8px;
      backdrop-filter: blur(6px);
      position:relative;
    }
    .search-bar input {
      flex:1 1 300px;
      padding:14px 16px;
      border-radius:6px;
      border:1px solid rgba(255,255,255,0.1);
      background: rgba(0,0,0,0.4);
      color:#fff;
      font-size:1rem;
      outline:none;
      transition:box-shadow var(--transition);
      min-width:160px;
    }
    .search-bar input:focus { box-shadow: 0 0 12px rgba(255,76,76,.7); }
    .search-bar button {
      flex:0 0 160px;
      padding:14px;
      background: var(--accent);
      border:none;
      border-radius:6px;
      color:#fff;
      cursor:pointer;
      font-weight:600;
      position:relative;
      overflow:hidden;
      transition:transform .15s, filter .2s;
    }
    .search-bar button:active { transform: scale(.95); }
    .search-bar button:hover { filter: brightness(1.05); }

    #searchResults {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 6px;
      max-height: 280px;
      overflow-y: auto;
      width:100%;
      margin:0 auto;
    }
    .build-card {
      background: rgba(255,255,255,0.05);
      border-radius:8px;
      padding:8px;
      width:140px;
      display:flex;
      flex-direction:column;
      align-items:center;
      cursor:pointer;
      position:relative;
      font-size:11px;
      gap:6px;
    }
    .build-card .title {
      font-weight:600;
      width:100%;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .build-card .avatar {
      width:60px;
      height:60px;
      border-radius:50%;
      overflow:hidden;
      background:#111;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .build-card .avatar img {
      width:100%;
      height:100%;
      object-fit:contain;
    }
    .slots-preview {
      display:flex;
      gap:4px;
      flex-wrap:wrap;
      justify-content:center;
      width:100%;
    }
    .slot-thumb {
      width:16px;
      height:16px;
      border-radius:3px;
      background-size:cover;
      background-position:center;
      flex:0 0 auto;
    }
    .no-builds {
      width:100%;
      padding:8px;
      text-align:center;
    }

    .builder-area {
      flex:1;
      display:flex;
      justify-content:center;
      align-items:flex-start;
      padding:0;
      margin-top:10px;
      position:relative;
    }
    .build-container {
      position:relative;
      display:grid;
      gap: var(--gap);
      background: rgba(255,255,255,0.03);
      padding:28px 30px 40px;
      border-radius:14px;
      box-shadow: var(--shadow);
      width:100%;
      max-width:1200px;
      grid-template-columns: minmax(140px, 1fr) 220px 260px 160px;
      grid-template-rows:
        auto
        auto
        auto
        auto;
      grid-template-areas:
        "hero hero hero hero"
        "label-starmarks label-artifacts label-artifacts label-moon"
        "starmarks artifacts artifacts moonbadges"
        "starmarks artifacts artifacts moonbadges"
        "actions actions actions actions";
      align-items:start;
      overflow: hidden;
      transform: scale(var(--builder-scale));
    }
    .builder-character {
      position: absolute;
      top: 50%;
      left: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      width: 90%;
      height: 90%;
      background-position: center;
      background-size: contain;
      background-repeat: no-repeat;
      opacity: 0.18;
      z-index: 0;
      transition: opacity .3s;
    }
    .hero-slot {
      grid-area: hero;
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      gap:12px;
      padding:12px 16px;
      background: rgba(255,255,255,0.04);
      border-radius:10px;
      position:relative;
      width:100%;
      max-width:250px;
      z-index:1;
    }
    .hero-preview {
      position:relative;
      width:100px;
      height:100px;
      border-radius:50%;
      overflow:hidden;
      background: #111;
      flex:0 0 auto;
      border:3px solid gold;
      display:flex;
      justify-content:center;
      align-items:center;
    }
    .hero-preview img {
      width:100%;
      height:100%;
      object-fit:contain;
      filter: none;
    }
    .hero-info {
      flex:1;
      display:flex;
      flex-direction:column;
      gap:4px;
      min-width:0;
    }
    .hero-label {
      font-size:.65rem;
      text-transform:uppercase;
      letter-spacing:1px;
      margin:0;
      font-weight:600;
      color:#fff;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .hero-selection {
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      align-items:center;
    }
    .hero-select {
      padding:8px 16px;
      background: var(--accent);
      border:none;
      border-radius:6px;
      color:#fff;
      cursor:pointer;
      font-weight:600;
      text-transform:uppercase;
      transition:transform .15s, filter .2s;
      flex:0 0 auto;
    }
    .hero-select:active { transform: scale(.95); }
    .hero-select:hover { filter: brightness(1.05); }
    .hero-background {
      position:absolute;
      inset:0;
      z-index:-1;
      background-size:contain;
      background-position:center;
      background-repeat:no-repeat;
      opacity:.08;
    }

    .group-label {
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:1px;
      font-size:1rem;
      color: var(--label-color);
      display:inline-block;
      margin-bottom:6px;
      transform: translate(var(--label-offset-x), var(--label-offset-y));
    }
    .label-starmarks { grid-area: label-starmarks; justify-self:center; }
    .label-artifacts { grid-area: label-artifacts; justify-self:center; }
    .label-moon { grid-area: label-moon; justify-self:center; }

    .starmarks {
      grid-area: starmarks;
      display:grid;
      grid-template-columns: repeat(2, var(--slot-small));
      grid-template-rows: repeat(2, var(--slot-small));
      gap:14px;
      position:relative;
      justify-content:center;
    }
    .artifacts {
      grid-area: artifacts;
      display:flex;
      justify-content:center;
      align-items:center;
      position:relative;
      min-width: var(--slot-big);
      min-height: var(--slot-big);
    }
    .moonbadges {
      grid-area: moonbadges;
      display:flex;
      flex-direction:column;
      gap:18px;
      justify-content:flex-start;
      align-items:center;
    }
    .moon-circle {
      position:relative;
      width: var(--slot-small);
      height: var(--slot-small);
      border-radius:50%;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .slot {
      position:relative;
      background: rgba(255,255,255,0.02) center/cover no-repeat;
      cursor:pointer;
      border-radius:8px;
      transition: box-shadow var(--transition), transform .15s;
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
      width: var(--slot-small);
      height: var(--slot-small);
      flex: 0 0 auto;
      min-width:0;
    }
    .slot .plus {
      position:absolute;
      display:flex;
      justify-content:center;
      align-items:center;
      inset:0;
      font-size:32px;
      color: rgba(255,255,255,0.75);
      pointer-events:none;
      user-select:none;
    }
    .slot.filled .plus { display:none; }
    .slot:hover { filter: brightness(1.08); }
    .slot:active { transform: scale(.95); }

    .slot[data-category="Starmarks"] {
      box-shadow: 0 0 14px gold, 0 0 28px gold;
      border:3px solid gold;
    }
    .slot[data-category="Artifacts"] {
      box-shadow: 0 0 14px red, 0 0 28px red;
      border:3px solid red;
      border-radius:50%;
      width: var(--slot-big);
      height: var(--slot-big);
    }
    .slot[data-category="MoonBadges"] {
      box-shadow: 0 0 14px #ccc, 0 0 28px #ccc;
      border:3px solid rgba(255,255,255,.6);
      border-radius:50%;
      width: var(--slot-small);
      height: var(--slot-small);
    }

    .actions {
      grid-area: actions;
      display:flex;
      gap:16px;
      margin-top:20px;
      flex-wrap:wrap;
    }
    .actions button {
      flex:1;
      min-width:200px;
      padding:16px 12px;
      background: var(--accent);
      border:none;
      border-radius:8px;
      color:#fff;
      font-weight:600;
      cursor:pointer;
      transition:transform .15s, filter .2s;
    }
    .actions button:active { transform: scale(.95); }
    .actions button:hover { filter: brightness(1.05); }

    /* Picker Overlay (Icons / Characters) */
    #iconPicker, #charPicker {
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.85);
      z-index:90;
      align-items:flex-start;
      justify-content:center;
      padding:80px 14px 14px;
      overflow:hidden;
    }
    .picker-panel {
      background: var(--picker-bg);
      padding:0;
      border-radius:10px;
      max-width:1000px;
      width:100%;
      display:flex;
      flex-direction:column;
      overflow:hidden;
      box-shadow:0 20px 60px rgba(0,0,0,0.7);
    }
    .picker-header {
      position:sticky;
      top:0;
      display:flex;
      align-items:center;
      gap:8px;
      padding:14px 16px;
      border-bottom:1px solid rgba(255,255,255,0.08);
      background: rgba(0,0,0,0.9);
      z-index:2;
    }
    .picker-header .title {
      font-size:1.2rem;
      font-weight:600;
      flex:1;
      white-space: nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      background: rgba(0,0,0,0);
      padding:4px 8px;
      border-radius:4px;
    }
    .close-btn {
      background: transparent;
      border:none;
      color:#fff;
      cursor:pointer;
      font-size:1.2rem;
      padding:6px 10px;
      border-radius:6px;
      transition:background .2s;
    }
    .close-btn:hover { background: rgba(255,255,255,0.08); }

    #charItems, #iconItems {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px,1fr));
      grid-auto-rows: 160px;
      gap:12px;
      padding:12px;
      max-height:65vh;
      overflow:auto;
      position:relative;
      z-index:1;
    }
    .picker-item {
      background: rgba(255,255,255,0.03);
      border-radius:8px;
      position:relative;
      cursor:pointer;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:6px;
      transition: transform .15s, box-shadow .2s;
      width:100%;
      height:100%;
      min-width:0;
      will-change: transform;
    }
    .picker-item:hover { transform: scale(1.02); }
    .picker-item:active { transform: scale(.98); }
    .picker-item img {
      max-width:100%;
      max-height:100%;
      object-fit:contain;
      border-radius:4px;
      display:block;
    }
    .picker-loading {
      padding:40px;
      width:100%;
      display:flex;
      justify-content:center;
      align-items:center;
      font-size:14px;
      gap:12px;
    }
    .spinner {
      width:18px;
      height:18px;
      border:3px solid rgba(255,255,255,0.2);
      border-top-color: #ff4c4c;
      border-radius:50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #charItems::-webkit-scrollbar,
    #iconItems::-webkit-scrollbar,
    #searchResults::-webkit-scrollbar {
      width:10px;
    }
    #charItems::-webkit-scrollbar-track,
    #iconItems::-webkit-scrollbar-track,
    #searchResults::-webkit-scrollbar-track {
      background: rgba(255,255,255,0.02);
      border-radius:6px;
    }
    #charItems::-webkit-scrollbar-thumb,
    #iconItems::-webkit-scrollbar-thumb,
    #searchResults::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.15);
      border-radius:6px;
    }

    @media (max-width: 1200px) {
      .build-container {
        grid-template-columns: 1fr 1fr 1fr;
        grid-template-areas:
          "hero hero hero"
          "label-starmarks label-artifacts label-moon"
          "starmarks artifacts moonbadges"
          "starmarks artifacts moonbadges"
          "actions actions actions";
      }
      .moonbadges { align-items:flex-start; }
    }
    @media (max-width: 900px) {
      .build-container {
        grid-template-columns: 1fr;
        grid-template-areas:
          "hero"
          "label-starmarks"
          "starmarks"
          "label-artifacts"
          "artifacts"
          "label-moon"
          "moonbadges"
          "actions";
      }
      .starmarks { justify-content:center; }
      .artifacts { justify-content:center; }
      .moonbadges { flex-direction:row; gap:12px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="search-bar">
      <input id="searchInput" placeholder="Build-Namen…" />
      <button onclick="searchBuild()">Suchen</button>
    </div>
    <div id="searchResults"></div>

    <div class="builder-area">
      <div class="build-container">
        <div class="builder-character" id="builderCharacterBg"></div>

        <div class="hero-slot">
          <div class="hero-preview" id="heroDisplay">
            <div style="font-size:12px;opacity:.7;" id="noCharText">Keine</div>
          </div>
          <div class="hero-info">
            <div class="hero-label">Charakter</div>
            <div class="hero-selection">
              <button class="hero-select" onclick="openCharacterPicker()">Charakter wählen</button>
            </div>
          </div>
        </div>

        <div class="group-label label-starmarks">Starmarks</div>
        <div class="group-label label-artifacts">Artifacts</div>
        <div class="group-label label-moon">Moonbadges</div>

        <div class="starmarks">
          <div class="slot" data-slot="sq1" data-category="Starmarks"><div class="plus">+</div></div>
          <div class="slot" data-slot="sq3" data-category="Starmarks"><div class="plus">+</div></div>
          <div class="slot" data-slot="sq5" data-category="Starmarks"><div class="plus">+</div></div>
          <div class="slot" data-slot="sq6" data-category="Starmarks"><div class="plus">+</div></div>
        </div>

        <div class="artifacts">
          <div class="slot" data-slot="ct" data-category="Artifacts"><div class="plus">+</div></div>
        </div>

        <div class="moonbadges">
          <div class="moon-circle">
            <div class="slot" data-slot="sq2" data-category="MoonBadges"><div class="plus">+</div></div>
          </div>
          <div class="moon-circle">
            <div class="slot" data-slot="sq4" data-category="MoonBadges"><div class="plus">+</div></div>
          </div>
        </div>

        <div class="actions">
          <button onclick="saveBuild()">Speichern</button>
          <button onclick="generateLink()">Link kopieren</button>
        </div>
      </div>
    </div>
  </main>

  <div id="charPicker">
    <div class="picker-panel">
      <div class="picker-header">
        <div class="title">Charakter wählen</div>
        <button class="close-btn" onclick="closeCharacterPicker()">✕</button>
      </div>
      <div id="charItems"></div>
    </div>
  </div>

  <div id="iconPicker">
    <div class="picker-panel">
      <div class="picker-header">
        <div class="title">Icon wählen</div>
        <button class="close-btn" onclick="closePicker()">✕</button>
      </div>
      <div id="iconItems"></div>
    </div>
  </div>

  <button id="devToggle" style="position:fixed;top:12px;right:12px;background:#111;border:2px solid #ff4c4c;padding:8px 14px;color:#fff;border-radius:6px;cursor:pointer;z-index:999;font-size:0.85rem;backdrop-filter:blur(4px);">Dev</button>
  <div id="devPanel" aria-label="Dev Panel" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,0.95); padding:16px 18px; border-radius:10px; width:340px; max-width:90vw; box-shadow:0 0 24px rgba(255,76,76,.7); z-index:1000; color:#fff; font-size:13px; gap:8px; font-family: system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">
    <button id="devClose" style="position:absolute; top:6px; right:6px; background:transparent; border:none; color:#fff; font-size:16px; cursor:pointer;">✕</button>
    <h4 style="margin:0 0 6px; font-size:1rem; letter-spacing:1px;">Developer Panel</h4>

    <div id="delete-build-section" style="margin-top:12px; display:flex; flex-direction:column; gap:8px; border-top:1px solid rgba(255,255,255,0.1); padding-top:10px;">
      <div style="font-size:0.9rem; font-weight:600;">Builds löschen (Komma-getrennt oder Haken wählen):</div>
      <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:flex-start;">
        <input id="deleteBuildInput" placeholder="z.B. TestBuild1,TestBuild2" style="flex:1; padding:8px; border-radius:6px; border:1px solid rgba(255,255,255,0.2); background:#111; color:#fff; min-width:180px;" />
        <button id="refreshBuildsForDelete" style="padding:8px 12px; background:#444; border:none; border-radius:6px; cursor:pointer; color:#fff;">Liste laden</button>
        <button id="deleteBuildsBtn" style="padding:8px 12px; background:var(--accent); border:none; border-radius:6px; cursor:pointer; color:#fff;">Löschen</button>
      </div>
      <div id="availableBuildsList" style="max-height:220px; overflow:auto; background:rgba(255,255,255,0.03); padding:8px; border-radius:6px; font-size:12px;">
        <div style="opacity:.6;">Klicke "Liste laden", um aktuelle Builds zu sehen.</div>
      </div>
      <div id="deleteStatus" style="font-size:12px; margin-top:4px;"></div>
    </div>
  </div>

  <script>
    const REPO   = 'Reso1992/RpXBuilder';
    const BRANCH = 'main';
    let activeSlot = null;
    let selectedCharacter = null;

    const categoryFolderMap = {
      Starmarks:  'Starmarks',
      Artifacts:  'Artifacts',
      MoonBadges: 'Moonbadges',
      Characters: 'Characters'
    };

    function showLoading(container, text) {
      container.innerHTML = '';
      const loading = document.createElement('div');
      loading.className = 'picker-loading';
      loading.innerHTML = `<div class="spinner" aria-hidden="true"></div><div>${text}</div>`;
      container.appendChild(loading);
    }

    function initSlotClicks() {
      document.querySelectorAll('.slot').forEach(slot => {
        if (slot.__bound) slot.removeEventListener('click', slot.__bound);
        const handler = async () => {
          activeSlot = slot;
          const cat = slot.dataset.category;
          const folder = categoryFolderMap[cat];
          const container = document.getElementById('iconItems');
          if (!container) return;
          container.innerHTML = '';
          showLoading(container, 'Icons laden…');
          try {
            const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${folder}?ref=${BRANCH}`);
            if (!res.ok) throw new Error('Ordner nicht gefunden');
            const files = await res.json();
            container.innerHTML = '';
            if (!files.length) {
              container.innerHTML = '<div style="color:#f55; padding:12px;">Keine Icons.</div>';
            } else {
              files.forEach(f => {
                if (f.type === 'file') {
                  const item = document.createElement('div');
                  item.classList.add('picker-item');
                  const img = document.createElement('img');
                  img.loading = 'lazy';
                  img.src = f.download_url;
                  img.title = f.name;
                  item.appendChild(img);
                  item.onclick = () => {
                    slot.style.backgroundImage = `url(${f.download_url})`;
                    slot.classList.add('filled');
                    slot.dataset.url = f.download_url;
                    closePicker();
                  };
                  container.appendChild(item);
                }
              });
            }
          } catch (e) {
            container.innerHTML = `<div style="color:#f55; padding:12px;">Fehler beim Laden</div>`;
            console.error(e);
          }
          document.getElementById('iconPicker').style.display = 'flex';
        };
        slot.__bound = handler;
        slot.addEventListener('click', handler);
      });
    }

    function closePicker() {
      document.getElementById('iconPicker').style.display = 'none';
    }

    async function openCharacterPicker() {
      const container = document.getElementById('charItems');
      if (!container) return;
      container.innerHTML = '';
      showLoading(container, 'Charaktere laden…');
      try {
        const res = await fetch(`https://api.github.com/repos/${REPO}/contents/Characters?ref=${BRANCH}`);
        if (!res.ok) throw new Error('Characters nicht erreichbar');
        const files = await res.json();
        container.innerHTML = '';
        if (!files.length) {
          container.innerHTML = '<div style="color:#f55; padding:12px;">Keine Charaktere.</div>';
        } else {
          files.forEach(f => {
            if (f.type === 'file') {
              const item = document.createElement('div');
              item.classList.add('picker-item');
              const img = document.createElement('img');
              img.loading = 'lazy';
              img.src = f.download_url;
              img.title = f.name;
              item.appendChild(img);
              item.onclick = () => {
                selectedCharacter = f;
                updateHero(f);
                closeCharacterPicker();
              };
              container.appendChild(item);
            }
          });
        }
      } catch (e) {
        container.innerHTML = `<div style="color:#f55; padding:12px;">Fehler beim Laden</div>`;
        console.error(e);
      }
      document.getElementById('charPicker').style.display = 'flex';
    }
    function closeCharacterPicker() {
      document.getElementById('charPicker').style.display = 'none';
    }

    function updateHero(f) {
      const disp = document.getElementById('heroDisplay');
      const noText = document.getElementById('noCharText');
      if (noText) noText.style.display = 'none';
      disp.innerHTML = '';
      const img = document.createElement('img');
      img.src = f.download_url;
      img.alt = f.name;
      disp.appendChild(img);

      const heroSlot = disp.closest('.hero-slot');
      if (heroSlot) {
        let bg = heroSlot.querySelector('.hero-background');
        if (!bg) {
          bg = document.createElement('div');
          bg.className = 'hero-background';
          heroSlot.appendChild(bg);
        }
        bg.style.backgroundImage = `url(${f.download_url})`;
      }

      const container = document.querySelector('.build-container');
      let big = container.querySelector('.builder-character');
      if (!big) {
        big = document.createElement('div');
        big.className = 'builder-character';
        container.prepend(big);
      }
      big.style.backgroundImage = `url(${f.download_url})`;
      big.style.opacity = '0.18';
    }

    async function saveBuild() {
      const name = prompt('Name für Deinen Build:');
      if (!name) return;

      const slots = {};
      document.querySelectorAll('.slot').forEach(s => {
        slots[s.dataset.slot] = s.dataset.url || '';
      });
      const character = selectedCharacter ? selectedCharacter.download_url : '';

      const payload = { name, slots, character };
      console.log('Speichere Build-Payload:', payload);

      try {
        const res = await fetch('/.netlify/functions/saveBuilds', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, slots, character })
        });
        if (!res.ok) {
          const text = await res.text();
          throw new Error(text);
        }
        alert(`Build "${name}" gespeichert.`);
      } catch (err) {
        console.error('Fehler beim Remote-Speichern:', err);
        alert('Fehler beim Speichern in GitHub. Build wurde eventuell nicht übernommen.');
      }
    }

    async function loadBuild(name) {
      let data = null;
      try {
        const r = await fetch(`https://raw.githubusercontent.com/${REPO}/${BRANCH}/builds.json`);
        if (r.ok) {
          const builds = await r.json();
          if (builds[name]) data = builds[name];
        }
      } catch (e) {
        console.warn('Remote load fehlgeschlagen', e);
      }

      if (!data) {
        try {
          const stored = JSON.parse(localStorage.getItem('rpx_builds') || '{}');
          if (stored[name]) data = stored[name];
        } catch (e) {
          console.warn('LocalStorage fallback fehlgeschlagen', e);
        }
      }

      if (!data) return alert(`Build "${name}" nicht gefunden.`);

      document.querySelectorAll('.slot').forEach(s => {
        const url = data.slots?.[s.dataset.slot] || '';
        if (url) {
          s.style.backgroundImage = `url(${url})`;
          s.classList.add('filled');
          s.dataset.url = url;
        } else {
          s.style.backgroundImage = '';
          s.classList.remove('filled');
          delete s.dataset.url;
        }
      });

      if (data.character) {
        selectedCharacter = { download_url: data.character, name: 'LoadedChar' };
        updateHero({ download_url: data.character, name: 'LoadedChar' });
      } else {
        selectedCharacter = null;
        const disp = document.getElementById('heroDisplay');
        if (disp) {
          disp.innerHTML = '<div style="font-size:12px;opacity:.7;" id="noCharText">Keine</div>';
        }
        const bg = document.querySelector('.hero-background');
        if (bg) bg.style.backgroundImage = '';
      }
    }

    async function searchBuild() {
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      const res = document.getElementById('searchResults');
      res.innerHTML = '';
      if (!q) return;
      try {
        const r = await fetch(`https://raw.githubusercontent.com/${REPO}/${BRANCH}/builds.json`);
        if (!r.ok) throw new Error('builds.json nicht verfügbar');
        const builds = await r.json();
        let found = false;
        Object.entries(builds).forEach(([name, data]) => {
          if (name.toLowerCase().includes(q)) {
            found = true;
            const card = document.createElement('div');
            card.classList.add('build-card');
            card.onclick = () => loadBuild(name);

            const title = document.createElement('div');
            title.className = 'title';
            title.textContent = name;
            card.appendChild(title);

            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            if (data.character) {
              const img = document.createElement('img');
              img.src = data.character;
              img.alt = 'Char';
              avatar.appendChild(img);
            } else {
              const placeholder = document.createElement('div');
              placeholder.textContent = '–';
              placeholder.style.color = '#888';
              avatar.appendChild(placeholder);
            }
            card.appendChild(avatar);

            const slotRow = document.createElement('div');
            slotRow.className = 'slots-preview';
            Object.keys(data.slots || {}).forEach(slotKey => {
              const url = data.slots[slotKey];
              if (url) {
                const thumb = document.createElement('div');
                thumb.className = 'slot-thumb';
                thumb.style.backgroundImage = `url(${url})`;
                slotRow.appendChild(thumb);
              }
            });
            card.appendChild(slotRow);

            res.appendChild(card);
          }
        });
        if (!found) {
          const none = document.createElement('div');
          none.className = 'no-builds';
          none.textContent = 'Keine Builds gefunden.';
          res.appendChild(none);
        }
      } catch (e) {
        console.error(e);
        const err = document.createElement('div');
        err.textContent = 'Fehler beim Laden der Builds.';
        err.style.color = '#f55';
        res.appendChild(err);
      }
    }

    function generateLink() {
      const params = new URLSearchParams();
      document.querySelectorAll('.slot').forEach(s => {
        if (s.dataset.url) params.set(s.dataset.slot, s.dataset.url);
      });
      if (selectedCharacter) params.set('character', selectedCharacter.download_url);
      navigator.clipboard.writeText(`${location.origin+location.pathname}?${params}`)
        .then(() => alert('Link kopiert!'));
    }

    // frischeste Buildliste (Github Contents API raw)
    async function fetchBuildNames() {
      try {
        const res = await fetch(`https://api.github.com/repos/${REPO}/contents/builds.json?ref=${BRANCH}`, {
          headers: { Accept: 'application/vnd.github.v3.raw' }
        });
        if (!res.ok) throw new Error(`Fehler beim Laden: ${res.status}`);
        const text = await res.text();
        const builds = JSON.parse(text);
        return Object.keys(builds);
      } catch (e) {
        console.error('Fehler beim Laden der Builds:', e);
        return null;
      }
    }

    function initDevDeleteBuildsUI() {
      const refreshBtn = document.getElementById('refreshBuildsForDelete');
      const deleteBtn = document.getElementById('deleteBuildsBtn');
      const input = document.getElementById('deleteBuildInput');
      const listContainer = document.getElementById('availableBuildsList');
      const status = document.getElementById('deleteStatus');

      async function loadList() {
        listContainer.innerHTML = '<div class="picker-loading"><div class="spinner"></div><div>Lade Builds…</div></div>';
        const names = await fetchBuildNames();
        if (!names) {
          listContainer.innerHTML = '<div style="color:#f55;">Fehler beim Laden der Builds.</div>';
          return;
        }
        listContainer.innerHTML = '';
        names.forEach(n => {
          const row = document.createElement('div');
          row.style.display = 'flex';
          row.style.alignItems = 'center';
          row.style.gap = '8px';
          row.style.marginBottom = '4px';
          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.value = n;
          cb.style.flex = '0 0 auto';
          const label = document.createElement('span');
          label.textContent = n;
          label.style.flex = '1';
          row.appendChild(cb);
          row.appendChild(label);
          listContainer.appendChild(row);
        });
      }

      refreshBtn?.addEventListener('click', loadList);

      deleteBtn?.addEventListener('click', async () => {
        status.textContent = '';
        const fromInput = input.value
          .split(',')
          .map(s => s.trim())
          .filter(Boolean);
        const checked = Array.from(listContainer.querySelectorAll('input[type=checkbox]:checked')).map(i => i.value);
        const toDelete = Array.from(new Set([...fromInput, ...checked]));
        if (!toDelete.length) {
          status.textContent = 'Keine Builds angegeben zum Löschen.';
          return;
        }

        if (!confirm(`Lösche Builds: ${toDelete.join(', ')}`)) return;

        status.textContent = 'Lösche…';
        try {
          const res = await fetch('/.netlify/functions/deleteBuilds', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ names: toDelete })
          });
          const text = await res.text();
          let data;
          try { data = JSON.parse(text); } catch { data = { raw: text }; }

          // Liste frisch neu laden und prüfen
          await loadList();
          const remaining = Array.from(listContainer.querySelectorAll('input')).map(i => i.value);
          const stillPresent = toDelete.filter(n => remaining.includes(n));

          if (!res.ok) {
            status.innerHTML = `<span style="color:#f55;">Fehler beim Löschen: ${data.message || data.raw || res.statusText}</span>`;
          } else if (stillPresent.length) {
            status.innerHTML = `<span style="color:#f55;">Teilweise gelöscht, noch vorhanden: ${stillPresent.join(', ')}</span>`;
          } else {
            status.innerHTML = `<span style="color:#0f8;">Gelöscht: ${data.removed?.join(', ') || toDelete.join(', ')}</span>`;
            input.value = '';
          }
        } catch (e) {
          console.error(e);
          status.innerHTML = `<span style="color:#f55;">Netzwerkfehler beim Löschen.</span>`;
        }
      });

      loadList();
    }

    // Dev Panel Logic (angepasst)
    (function(){
      const PASSWORD = 'devpass';
      const devToggle = document.getElementById('devToggle');
      const panel = document.getElementById('devPanel');
      const closeBtn = document.getElementById('devClose');
      const inpSlotSmall = document.getElementById('inpSlotSmall');
      const inpSlotBig = document.getElementById('inpSlotBig');
      const inpGap = document.getElementById('inpGap');
      const inpBuilderScale = document.getElementById('inpBuilderScale');
      const inpLabelOffsetX = document.getElementById('inpLabelOffsetX');
      const inpLabelOffsetY = document.getElementById('inpLabelOffsetY');
      const exportCSS = document.getElementById('exportCSS');

      const defaults = {
        '--slot-small': 110,
        '--slot-big': 220,
        '--gap': 18,
        'builder-scale': 1,
        labelOffsetX: 0,
        labelOffsetY: 0
      };
      let state = JSON.parse(localStorage.getItem('rpxDevConfig')||'{}');
      state = Object.assign({}, defaults, state);

      function syncInputs(){
        if (!inpSlotSmall) return;
        inpSlotSmall.value = state['--slot-small'];
        inpSlotBig.value = state['--slot-big'];
        inpGap.value = state['--gap'];
        inpBuilderScale.value = state['builder-scale'];
        inpLabelOffsetX.value = state.labelOffsetX;
        inpLabelOffsetY.value = state.labelOffsetY;
      }
      function applyState(){
        document.documentElement.style.setProperty('--slot-small', state['--slot-small'] + 'px');
        document.documentElement.style.setProperty('--slot-big', state['--slot-big'] + 'px');
        document.documentElement.style.setProperty('--gap', state['--gap'] + 'px');
        document.documentElement.style.setProperty('--builder-scale', state['builder-scale']);
        document.documentElement.style.setProperty('--label-offset-x', state.labelOffsetX + 'px');
        document.documentElement.style.setProperty('--label-offset-y', state.labelOffsetY + 'px');
        const container = document.querySelector('.build-container');
        if(container) container.style.transform = `scale(${state['builder-scale']})`;
        updateExport();
      }
      function updateExport(){
        if (!exportCSS) return;
        exportCSS.value = `
:root {
  --slot-small: ${state['--slot-small']}px;
  --slot-big: ${state['--slot-big']}px;
  --gap: ${state['--gap']}px;
  --builder-scale: ${state['builder-scale']};
  --label-offset-x: ${state.labelOffsetX}px;
  --label-offset-y: ${state.labelOffsetY}px;
}
`.trim();
      }
      function persist(){ localStorage.setItem('rpxDevConfig', JSON.stringify(state)); }

      syncInputs();
      applyState();

      devToggle.addEventListener('click', ()=>{
        const attempt = prompt('Dev Panel Passwort:');
        if(attempt !== PASSWORD){ alert('Falsches Passwort'); return; }
        panel.style.display='flex';
      });
      if (closeBtn) closeBtn.addEventListener('click', ()=> panel.style.display='none');

      const applyBtn = document.getElementById('applyDev');
      const resetBtn = document.getElementById('resetDev');
      const copyBtn = document.getElementById('copyCSS');

      if (applyBtn) applyBtn.addEventListener('click', ()=>{
        state['--slot-small'] = parseInt(inpSlotSmall?.value) || defaults['--slot-small'];
        state['--slot-big'] = parseInt(inpSlotBig?.value) || defaults['--slot-big'];
        state['--gap'] = parseInt(inpGap?.value) || defaults['--gap'];
        state['builder-scale'] = parseFloat(inpBuilderScale?.value) || defaults['builder-scale'];
        state.labelOffsetX = parseInt(inpLabelOffsetX?.value) || 0;
        state.labelOffsetY = parseInt(inpLabelOffsetY?.value) || 0;
        persist();
        applyState();
      });
      if (resetBtn) resetBtn.addEventListener('click', ()=>{
        state = Object.assign({}, defaults);
        syncInputs();
        persist();
        applyState();
      });
      if (copyBtn) copyBtn.addEventListener('click', ()=>{
        if (!exportCSS) return;
        exportCSS.select();
        document.execCommand('copy');
        alert('CSS kopiert. Wenn du willst, kannst du es später manuell ins :root schreiben.');
      });
    })();

    window.addEventListener('load', () => {
      initSlotClicks();
      initDevDeleteBuildsUI();
      const p = new URLSearchParams(location.search);
      document.querySelectorAll('.slot').forEach(s => {
        const url = p.get(s.dataset.slot);
        if (url) {
          s.style.backgroundImage = `url(${url})`;
          s.classList.add('filled');
          s.dataset.url = url;
        }
      });
      if (p.get('character')) {
        selectedCharacter = { download_url: p.get('character'), name: '' };
        updateHero({ download_url: p.get('character'), name: 'URLChar' });
      }
    });
  </script>
